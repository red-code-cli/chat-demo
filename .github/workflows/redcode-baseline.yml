name: RedCode baseline snapshots
on:
  push:
    branches: [redcode/phase-0]
permissions:
  contents: write
concurrency:
  group: redcode-baseline
  cancel-in-progress: true
jobs:
  snapshots:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: redcode/phase-0
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.6.0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Generate visual baselines
        run: pnpm exec playwright test tests/visual --update-snapshots
      - name: Commit baselines
        run: |
          git config user.name "red-code-cli"
          git config user.email "redcode@users.noreply.github.com"
          git add tests/visual/*.png
          git diff --cached --quiet || git commit -m "test: add generated visual baselines"
          git push
